name: Build Christmas Lunch APK

on:
  push:
    branches:
      - 'arena/*'
    paths:
      - 'christmas-lunch-app/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor
        working-directory: christmas-lunch-app
        run: npm install

      - name: Add Android platform
        working-directory: christmas-lunch-app
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        working-directory: christmas-lunch-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: christmas-lunch-apk
          path: christmas-lunch-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Release APK to GitHub Releases
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: christmas-lunch-${{ github.run_number }}
          name: Christmas Lunch App v${{ github.run_number }}
          files: christmas-lunch-app/android/app/build/outputs/apk/debug/app-debug.apk
