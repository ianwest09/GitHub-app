<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16442f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Christmas Lunch · Port Alfred</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">✦</span>
      <div>
        <h1>Christmas Lunch</h1>
        <p class="sub">Port Alfred · 10 guests · alcohol-free</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill" id="status-pill">offline ready</span>
      <button class="icon-btn" id="btn-print" title="Print large-print cards" aria-label="Print large-print cards">⎙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="run" class="active">Run sheet</button>
    <button data-tab="cook">Cook mode</button>
    <button data-tab="shop">Shopping</button>
    <button data-tab="agenda">Agenda</button>
    <button data-tab="cost">Cost &amp; route</button>
    <button data-tab="more">More</button>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="foot">
    <span>Core data stays on this device. Optional LAN sync is off by default.</span>
    <span id="foot-meta"></span>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="modal-back" id="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="Close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<section id="print-sheet" aria-hidden="true"></section>

<script type="module" src="./js/app.js"></script>
</body>
</html>
